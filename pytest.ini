# Python test configuration.
#
# `-p no:asyncio` is not a preference. A globally-installed pytest-asyncio
# crashes during collection of shared/hmac-utils/py:
#
#   INTERNALERROR> AttributeError: 'Package' object has no attribute 'obj'
#     (pytest_asyncio/plugin.py, pytest_collectstart)
#
# That is a plugin/pytest version clash in the developer's environment, and it
# predates the AI work — `npm run test:py` hit it before ai-service existed.
# Neither suite uses asyncio tests, so disabling the plugin is a correct fix
# rather than a workaround, and it keeps a bare `pytest` invocation working too.
[pytest]
addopts = -p no:asyncio
testpaths =
    shared/hmac-utils/py
    ai-service/tests
